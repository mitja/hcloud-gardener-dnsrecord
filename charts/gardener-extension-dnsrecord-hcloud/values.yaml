image:
  repository: ghcr.io/mitja/hcloud-gardener-dnsrecord
  tag: v0.1.0
  pullPolicy: IfNotPresent

replicaCount: 1

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

# vertical pod autoscaler (optional)
vpa:
  enabled: true
  updateMode: Auto

# controller settings
controllers:
  dnsrecord:
    concurrentSyncs: 5
  ignoreOperationAnnotation: false

# heartbeat lease renew interval in seconds
heartbeat:
  renewIntervalSeconds: 30

# log configuration
logLevel: info
logFormat: json

# additional pod metadata
podAnnotations: {}
podLabels: {}

nodeSelector: {}
tolerations: []
